name: generic-windows

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'windows/**'
      - 'deps/edk2/**'
  pull_request:
    paths:
      - 'windows/**'
      - 'deps/edk2/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version of the package, for example 1.0.0'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  efi:
    name: EFI application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # The EDK2 headers are vendored, so the build needs no network.
      - name: Build the EFI application
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $candidate = "$env:ProgramFiles\LLVM\bin\clang.exe"
            if (Test-Path $candidate) { $clang = $candidate }
          }
          if (-not $clang) { throw 'clang.exe was not found' }

          $lld = (Get-Command lld-link.exe -ErrorAction SilentlyContinue).Source
          if (-not $lld) {
            $candidate = "$env:ProgramFiles\LLVM\bin\lld-link.exe"
            if (Test-Path $candidate) { $lld = $candidate }
          }
          if (-not $lld) { throw 'lld-link.exe was not found' }

          & "$env:GITHUB_WORKSPACE\windows\efi\build.ps1" -Clang $clang -LldLink $lld -Output "$PWD\build"
          if ($LASTEXITCODE -ne 0) { throw 'The EFI build failed' }

      - name: Verify the PE image
        shell: pwsh
        run: |
          python internal-boot/unlock/verify_pe.py build/UNLOCK.EFI build/UNLOCK.map --output build/pe-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'The PE verification failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: efi-application
          path: |
            build/UNLOCK.EFI
            build/pe-verification.json

  helper:
    name: zstd helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # The helper is built for Windows, because the tar.exe that comes with
      # Windows is built on libarchive 3.3.2, which has no zstd support.
      - name: Build the helper
        run: |
          chmod +x windows/installer/zstd/build.sh
          windows/installer/zstd/build.sh x86_64-w64
          file windows/installer/zstd/build/zstdcat.exe

      # The fixture is built here, because the runner has tar and zstd, so no
      # Python package is needed anywhere.
      - name: Create the test fixture
        run: |
          mkdir -p build/fixture/test
          head -c 16384 /dev/urandom > build/fixture/test/member.bin
          # The ballast makes the archive much bigger than the member, so the
          # stream can be cut short to prove that the helper stops at the
          # member and does not need the rest of it.
          head -c 4194304 /dev/urandom > build/fixture/test/ballast.bin
          tar -C build/fixture -cf build/fixture/fixture.tar test
          zstd -q -f -o build/fixture/fixture.tar.zst build/fixture/fixture.tar
          sha256sum build/fixture/test/member.bin | tee build/fixture/member.sha256

          # The standard input of a Windows program is in text mode by
          # default, and a read in text mode stops at the first Ctrl-Z byte.
          # The fixture has to hold one early, or the test would not cover
          # that trap.
          python3 - <<'PY'
          data = open('build/fixture/fixture.tar.zst', 'rb').read()
          position = data.find(b'\x1a')
          if position < 0 or position > 65536:
              raise SystemExit('the fixture holds no Ctrl-Z byte in the first 64 KiB')
          print('the fixture holds a Ctrl-Z byte at offset', position)
          PY

      # Everything that the next job needs is staged in one directory, so
      # that the artifact does not carry the tree of the repository with it.
      - name: Stage the artifact
        run: |
          mkdir -p build/stage/fixture
          cp windows/installer/zstd/build/zstdcat.exe build/stage/zstdcat.exe
          cp build/fixture/fixture.tar.zst build/stage/fixture/fixture.tar.zst
          cp build/fixture/member.sha256 build/stage/fixture/member.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: zstd-helper
          path: build/stage/

  tests:
    name: host tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Build and run the host tests
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $candidate = "$env:ProgramFiles\LLVM\bin\clang.exe"
            if (Test-Path $candidate) { $clang = $candidate }
          }
          if (-not $clang) { throw 'clang.exe was not found' }

          New-Item -ItemType Directory -Path build -Force | Out-Null
          & $clang -std=c11 -Wall -Wextra -Werror -O1 -DGU_HOST_TEST=1 `
            -o build/test_generic_board.exe `
            windows/tests/test_generic_board.c windows/efi/board.c windows/efi/checks.c
          if ($LASTEXITCODE -ne 0) { throw 'The test build failed' }
          & build/test_generic_board.exe
          if ($LASTEXITCODE -ne 0) { throw 'The host tests failed' }

      - name: Parse the PowerShell installer scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows/installer/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) at line $($_.Extent.StartLineNumber)" }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed) { throw 'A PowerShell script did not parse' }

      - name: Run the installer logic tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File windows/tests/test-installer-logic.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The installer logic tests failed' }

  firmware:
    name: firmware assets
    runs-on: windows-2022
    needs: [helper]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: zstd-helper
          path: build/helper

      # The firmware pipeline is the part of the installation that depends on
      # what the machine has. It unpacks an archive and it takes a member out
      # of a package with the helper. It is run here for real, on the same
      # Windows that the users have, so that a difference is found here and
      # not on their machine. It is the step that failed on the machine of
      # the first user of the installer.
      - name: Produce the firmware assets
        shell: pwsh
        run: |
          # The helper is put where the installer puts it, so that the run
          # covers the real call path.
          $helper = "$env:TEMP\WindowsGPUUnlock"
          New-Item -ItemType Directory -Path $helper -Force | Out-Null
          Copy-Item build/helper/zstdcat.exe (Join-Path $helper 'zstdcat.exe') -Force

          . ./windows/installer/Get-FirmwareAssets.ps1
          Get-FirmwareAssets -OutputDirectory "$env:RUNNER_TEMP\assets" -WorkingDirectory "$env:RUNNER_TEMP\work"

      - name: Check the firmware assets
        shell: pwsh
        run: |
          $expected = @{
            'booter_load_ga102.bin'   = '056cbc064a888f80717726c54d7f64fcd68044d123870c95a74f37f4975dcaa4'
            'v67-ga102-610.43.03.bin' = '2a0aa1f86d0b6afff5214d641d87d46dc98ef06ed908ff05d0ddbad5ffb7e197'
            'gsp_ga10x.bin'           = '572373620a37418f24dc16b5031c39338778c3257e48e8408de9a57291b24f3a'
            'gsp_boot_ga102.bin'      = '3df651acb174fd5f5561a1996965b192f50c5d763168446ed0d4ead19d895768'
            'gsp_boot_desc_ga102.bin' = 'cc5a3fc1f4c47f2fe107b1b68f0176d8a448e6dec84b575e5560ccef5262bf15'
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path "$env:RUNNER_TEMP\assets" $name
            if (-not (Test-Path $path)) { throw "the pipeline did not produce $name" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$name]) {
              throw "$name does not match: expected $($expected[$name]), got $actual"
            }
            Write-Host "OK   $name  $actual"
          }

  boot:
    name: boot configuration
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # The boot configuration is read and changed with bcdedit, and its
      # output is parsed by the installer. The names of the properties in
      # that output are in the language of the machine, and bcdedit prints
      # a well known name instead of the real identifier unless it is asked
      # to be verbose. The output is therefore taken here, on a real
      # Windows, so that the parser is written against it and not against
      # a guess.
      - name: Take the boot configuration apart
        shell: pwsh
        run: |
          $bcdedit = Join-Path $env:SystemRoot 'System32\bcdedit.exe'
          Write-Host '--- bcdedit /enum {bootmgr} ---'
          & $bcdedit /enum '{bootmgr}'
          Write-Host '--- bcdedit /enum {bootmgr} /v ---'
          & $bcdedit /enum '{bootmgr}' /v
          Write-Host '--- bcdedit /enum {fwbootmgr} ---'
          & $bcdedit /enum '{fwbootmgr}'
          Write-Host '--- bcdedit /enum {fwbootmgr} /v ---'
          & $bcdedit /enum '{fwbootmgr}' /v
          Write-Host '--- bcdedit /enum all ---'
          & $bcdedit /enum all
      # The parser of the installer is run against the output of a real
      # bcdedit, and the whole registration cycle is carried out on the
      # runner, so that a difference between the parser and the real output
      # is found here and not on the machine of a user. Everything that the
      # cycle changes is put back afterwards.
      - name: Register a boot entry the way the installer does
        shell: pwsh
        run: |
          . ./windows/installer/Installer-Common.ps1

          $description = 'Windows GPU UNLOCK (CI)'
          $bcdedit = Join-Path $env:SystemRoot 'System32\bcdedit.exe'
          $beforeOrder = @()
          $made = @()

          try {
            # What bcdedit says it can do. The answer is written down here,
            # because it is the answer that the installer has to give.
            Write-Host '=== bcdedit /? ==='
            & $bcdedit /? 2>&1 | Out-String -Width 200

            # The identifier of the Windows Boot Manager.
            $managerText = Invoke-Bcd @('/enum', '{bootmgr}', '/v') -LogOutput
            $managerId = Get-BcdIdentifier -Text $managerText
            if (-not $managerId) { throw 'the identifier of the Windows Boot Manager could not be read' }
            Write-Host "OK   the Windows Boot Manager is $managerId"

            $managerDevices = @(Get-BcdPropertyValue -Text $managerText -ValuePattern '^partition=')
            if ($managerDevices.Count -eq 0) { throw 'the Windows Boot Manager does not name a device' }
            Write-Host "OK   the Windows Boot Manager boots from $($managerDevices[0])"

            # The firmware boot order before the change.
            $beforeOrder = @(Get-BcdDisplayOrder (Invoke-Bcd @('/enum', '{fwbootmgr}', '/v') -LogOutput))
            if ($beforeOrder.Count -eq 0) { throw 'the firmware boot order could not be read' }
            Write-Host "OK   the firmware boot order is $($beforeOrder -join ', ')"

            # Whether a change to the boot configuration stays at all. A runner
            # on which it does not would say that every entry was made, and
            # then not have it.
            [void](Invoke-Bcd @('/set', '{bootmgr}', 'timeout', '31') -LogOutput)
            $probe = Invoke-Bcd @('/enum', '{bootmgr}', '/v') -LogOutput
            Write-Host ("the timeout reads back as: {0}" -f (@(Get-BcdPropertyValue -Text $probe -ValuePattern '^\d+$') -join ', '))
            [void](Invoke-Bcd @('/set', '{bootmgr}', 'timeout', '30') -LogOutput)

            # Every way of making an entry is tried here, and the whole boot
            # configuration is printed after each of them, so that the way
            # that works is written down instead of guessed at.
            $variants = @(
                @{ Name = 'copy of the boot manager'; Id = ''
                   Args = @('/copy', '{bootmgr}', '/d', 'CI copy') },
                @{ Name = 'create plain'; Id = '{7c1f9d20-6f0a-4a1e-9d33-0b5e5a5c1a03}'
                   Args = @('/create', '{7c1f9d20-6f0a-4a1e-9d33-0b5e5a5c1a03}', '/d', 'CI plain') },
                @{ Name = 'create with a device'; Id = '{7c1f9d20-6f0a-4a1e-9d33-0b5e5a5c1a04}'
                   Args = @('/create', '{7c1f9d20-6f0a-4a1e-9d33-0b5e5a5c1a04}', '/d', 'CI device', '/device', $managerDevices[0]) },
                @{ Name = 'create with a system type'; Id = '{7c1f9d20-6f0a-4a1e-9d33-0b5e5a5c1a05}'
                   Args = @('/create', '{7c1f9d20-6f0a-4a1e-9d33-0b5e5a5c1a05}', '/d', 'CI system', '/system', 'true') }
            )

            foreach ($variant in $variants) {
              Write-Host "=== $($variant.Name) ==="
              try {
                [void](Invoke-Bcd $variant.Args -LogOutput)
              } catch {
                Write-Host "FAILED: $($_.Exception.Message)"
              }
              if ($variant.Id) {
                $made += $variant.Id
                Write-Host "--- bcdedit /enum $($variant.Id) ---"
                & $bcdedit /enum $variant.Id
                & $bcdedit /enum $variant.Id /v
              }
              Write-Host '--- bcdedit /enum all ---'
              & $bcdedit /enum all
            }

            # The entries that were made, found by their description, and the
            # way the installer looks for them.
            foreach ($variant in $variants) {
              $name = $variant.Args[3]
              $found = Get-BcdEntryId -Text (Invoke-Bcd @('/enum', 'all')) -Description $name
              Write-Host "the entry '$name' was found as '$found'"
            }
          } finally {
            # The runner has to boot the way it did before.
            $bcdedit = Join-Path $env:SystemRoot 'System32\bcdedit.exe'
            foreach ($id in $made) {
              & $bcdedit /delete $id
            }
            & $bcdedit /enum all | Select-String -Pattern 'CI ' -Context 0,3
            if ($beforeOrder.Count -gt 0) {
              & $bcdedit /set '{fwbootmgr}' displayorder $beforeOrder
            }
            Write-Host '--- the boot configuration was put back ---'
            & $bcdedit /enum '{fwbootmgr}' /v
          }

  installer:
    name: installer package
    runs-on: windows-2022
    needs: [efi, helper]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: efi-application
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: zstd-helper
          path: build/helper

      # The helper is exercised on Windows itself, so that a broken binary
      # cannot reach a release.
      - name: Test the helper
        shell: pwsh
        run: |
          # The same code that the installer uses, so that the test covers the
          # real call path.
          . windows/installer/Get-FirmwareAssets.ps1

          $expected = ((Get-Content build/helper/fixture/member.sha256) -split '\s+')[0].Trim()
          if (-not $expected) { throw 'The fixture digest is missing' }

          & build/helper/zstdcat.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The helper did not start' }

          $helper = (Resolve-Path 'build/helper/zstdcat.exe').Path
          $stream = (Resolve-Path 'build/helper/fixture/fixture.tar.zst').Path

          # The compressed stream goes into the standard input of the helper.
          $inputStream = [System.IO.File]::OpenRead($stream)
          try {
            $result = Invoke-ZstdHelper -HelperPath $helper -Member 'test/member.bin' `
              -OutputPath 'build/helper/member.bin' -InputStream $inputStream
          } finally {
            $inputStream.Dispose()
          }

          $actual = (Get-FileHash build/helper/member.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "The extracted member does not match: expected $expected, got $actual"
          }
          Write-Host "OK   the helper extracted the member ($actual)"

          # The stream is cut in half. The member sits at the front of the
          # archive, so the helper has to be able to finish without reading
          # the rest of it. This is what lets the installer abandon the
          # download once the member is complete.
          $bytes = [System.IO.File]::ReadAllBytes($stream)
          $half = [int]($bytes.Length / 2)
          $cut = New-Object byte[] $half
          [Array]::Copy($bytes, $cut, $half)
          [System.IO.File]::WriteAllBytes('build/helper/cut.tar.zst', $cut)

          $inputStream = [System.IO.File]::OpenRead((Resolve-Path 'build/helper/cut.tar.zst').Path)
          try {
            $result = Invoke-ZstdHelper -HelperPath $helper -Member 'test/member.bin' `
              -OutputPath 'build/helper/member-cut.bin' -InputStream $inputStream
          } finally {
            $inputStream.Dispose()
          }

          $actual = (Get-FileHash build/helper/member-cut.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "The member from the cut stream does not match: expected $expected, got $actual"
          }
          Write-Host "OK   the helper stopped at the member ($actual)"

      - name: Package the installer
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          # makensis ships with the NSIS package on the runner image.
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) { $makensis = $candidate }
          }
          if (-not $makensis) { throw 'makensis.exe was not found' }

          # A tag of the form v1.2.3 names the package; a run that asks for a
          # version names it as well; anything else is a development build.
          # The product version in the resources has to be a plain number, so
          # it is built apart from the name.
          $version = '1.0.0-dev'
          $productVersion = '1.0.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $productVersion = "$version.0"
          }
          if ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION
            $productVersion = "$version.0"
          }
          Write-Host "Building the installer for version $version"

          # The EFI application and the helper are carried as base64 text.
          # Antivirus software often refuses an unsigned EFI application, and
          # the installer would then not even unpack it.
          & pwsh -NoProfile -File windows/installer/Stage-Payload.ps1 `
            -Application build/UNLOCK.EFI `
            -Helper build/helper/zstdcat.exe `
            -OutputDirectory build/payload `
            -HelperOutputDirectory build/helper
          if ($LASTEXITCODE -ne 0) { throw 'The payload could not be staged' }

          Push-Location windows/installer
          try {
            & $makensis "-DVERSION=$version" "-DPRODUCT_VERSION=$productVersion" `
              "-DPAYLOAD=..\..\build\payload" "-DHELPER=..\..\build\helper" WindowsGPUUnlock.nsi
            if ($LASTEXITCODE -ne 0) { throw 'The installer packaging failed' }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/installer/*.exe

  smoke:
    name: installer smoke test
    runs-on: windows-2022
    needs: [installer]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: build/installer

      - uses: actions/download-artifact@v4
        with:
          name: efi-application
          path: build/efi

      # The packaged installer is run for real, so that the whole chain from
      # the window down to the scripts is covered. The runner has no card
      # that this tool applies to, so the installer is expected to refuse,
      # but it has to refuse with a readable reason and not silently.
      - name: Run the installer
        shell: pwsh
        env:
          WGPU_CHECK_ONLY: '1'
        run: |
          $exe = (Get-ChildItem build/installer/*.exe | Select-Object -First 1).FullName
          $target = "$env:RUNNER_TEMP\wgpu"
          Write-Host "running $exe into $target"

          $log = Join-Path $target 'install.log'
          $process = Start-Process -FilePath $exe -ArgumentList "/S /D=$target" -PassThru
          if (-not $process.WaitForExit(240000)) {
            Write-Host 'the installer did not finish in four minutes'
            try { $process.Kill() } catch { }
            if (Test-Path $log) {
              Write-Host '--- the log so far ---'
              Get-Content $log
              Write-Host '--- end of the log ---'
            } else {
              Write-Host 'the installer wrote no log file'
            }
            throw 'the installer hung'
          }
          Write-Host "exit code: $($process.ExitCode)"

          if (-not (Test-Path $log)) {
            Write-Host '--- what was installed ---'
            Get-ChildItem $target -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw 'the installer wrote no log file'
          }
          Write-Host '--- the log ---'
          Get-Content $log
          Write-Host '--- end of the log ---'

          Set-Content -Path "$env:RUNNER_TEMP\wgpu-exit.txt" -Value $process.ExitCode

      - name: Check the result
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\wgpu"
          $logPath = Join-Path $target 'install.log'
          $text = Get-Content $logPath -Raw
          $exitCode = [int](Get-Content "$env:RUNNER_TEMP\wgpu-exit.txt")

          foreach ($needle in @('Windows GPU UNLOCK', 'System checks', 'Secure Boot', 'WGPU-RESULT:')) {
            if ($text -notlike "*$needle*") { throw "the log does not mention: $needle" }
          }

          # bcdedit.exe is a 64 bit program and there is no 32 bit copy of it,
          # so the installer has to run in a 64 bit PowerShell. A 32 bit one
          # cannot find the command at all, and the installation stops at the
          # boot entry. This is what the first user of the installer ran
          # into, so the log has to say which process did the work.
          if ($text -notlike '*64 bit process*') {
            throw 'the installer did not run in a 64 bit process'
          }
          Write-Host 'OK   the installer ran in a 64 bit process'

          # The lines that the installer itself wrote have to be in there.
          # They used to be written over each other, because FileOpen in
          # append mode leaves the position at the start of the file.
          foreach ($needle in @('The installer started on this machine.', 'Unpacking the files.', 'The files are unpacked.')) {
            if ($text -notlike "*$needle*") { throw "the log does not mention: $needle" }
          }

          # One writer, one encoding. The installer writes single bytes and
          # the transcript does not, so a file with both in it is not readable.
          $bytes = [System.IO.File]::ReadAllBytes($logPath)
          if ($bytes -contains 0) { throw 'the log has null bytes in it, so more than one writer wrote to it' }
          Write-Host 'OK   the log is a single piece of text'

          # The application is carried as text and unpacked by the script.
          # The file that comes out has to be the one that was packed.
          $unpacked = Join-Path $env:TEMP 'WindowsGPUUnlock\UNLOCK.EFI'
          if (-not (Test-Path $unpacked)) { throw 'the application was not unpacked' }
          $expected = (Get-Content build/efi/pe-verification.json -Raw | ConvertFrom-Json).sha256
          $actual = (Get-FileHash $unpacked -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected.ToLowerInvariant()) {
            throw "the unpacked application does not match: expected $expected, got $actual"
          }
          Write-Host "OK   the application was unpacked and matches ($actual)"

          $helper = Join-Path $env:TEMP 'WindowsGPUUnlock\zstdcat.exe'
          if (-not (Test-Path $helper)) { throw 'the helper was not unpacked' }
          Write-Host 'OK   the helper was unpacked'

          foreach ($name in @('unlock-payload.txt', 'helper-payload.txt', 'payload-manifest.txt')) {
            if (-not (Test-Path (Join-Path $target $name))) { throw "the installer did not write $name" }
          }
          Write-Host 'OK   the installer carries the payload as text'

          if ($text -match 'WGPU-RESULT: ok') {
            if ($exitCode -ne 0) { throw "the installer said ok but returned $exitCode" }
          } else {
            if ($exitCode -eq 0) { throw 'the installer refused but returned 0' }
          }
          Write-Host "OK   the installer ran and reported (exit code $exitCode)"

      # The uninstaller is part of the same package, so it is run as well.
      - name: Run the uninstaller
        shell: pwsh
        run: |
          $uninstaller = "$env:RUNNER_TEMP\wgpu\Uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw 'the uninstaller was not installed' }
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          Write-Host "exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "the uninstaller returned $($process.ExitCode)" }
          Write-Host 'OK   the uninstaller ran'
