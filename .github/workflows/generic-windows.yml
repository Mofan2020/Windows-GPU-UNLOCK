name: generic-windows

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'windows/**'
      - 'deps/edk2/**'
  pull_request:
    paths:
      - 'windows/**'
      - 'deps/edk2/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version of the package, for example 1.0.0'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  efi:
    name: EFI application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # The EDK2 headers are vendored, so the build needs no network.
      - name: Build the EFI application
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $candidate = "$env:ProgramFiles\LLVM\bin\clang.exe"
            if (Test-Path $candidate) { $clang = $candidate }
          }
          if (-not $clang) { throw 'clang.exe was not found' }

          $lld = (Get-Command lld-link.exe -ErrorAction SilentlyContinue).Source
          if (-not $lld) {
            $candidate = "$env:ProgramFiles\LLVM\bin\lld-link.exe"
            if (Test-Path $candidate) { $lld = $candidate }
          }
          if (-not $lld) { throw 'lld-link.exe was not found' }

          & "$env:GITHUB_WORKSPACE\windows\efi\build.ps1" -Clang $clang -LldLink $lld -Output "$PWD\build"
          if ($LASTEXITCODE -ne 0) { throw 'The EFI build failed' }

      - name: Verify the PE image
        shell: pwsh
        run: |
          python internal-boot/unlock/verify_pe.py build/UNLOCK.EFI build/UNLOCK.map --output build/pe-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'The PE verification failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: efi-application
          path: |
            build/UNLOCK.EFI
            build/pe-verification.json

  helper:
    name: zstd helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # The helper is built for Windows, because the tar.exe that comes with
      # Windows is built on libarchive 3.3.2, which has no zstd support.
      - name: Build the helper
        run: |
          chmod +x windows/installer/zstd/build.sh
          windows/installer/zstd/build.sh x86_64-w64
          file windows/installer/zstd/build/zstdcat.exe

      # The fixture is built here, because the runner has tar and zstd, so no
      # Python package is needed anywhere.
      - name: Create the test fixture
        run: |
          mkdir -p build/fixture/test
          head -c 16384 /dev/urandom > build/fixture/test/member.bin
          # The ballast makes the archive much bigger than the member, so the
          # stream can be cut short to prove that the helper stops at the
          # member and does not need the rest of it.
          head -c 4194304 /dev/urandom > build/fixture/test/ballast.bin
          tar -C build/fixture -cf build/fixture/fixture.tar test
          zstd -q -f -o build/fixture/fixture.tar.zst build/fixture/fixture.tar
          sha256sum build/fixture/test/member.bin | tee build/fixture/member.sha256

          # The standard input of a Windows program is in text mode by
          # default, and a read in text mode stops at the first Ctrl-Z byte.
          # The fixture has to hold one early, or the test would not cover
          # that trap.
          python3 - <<'PY'
          data = open('build/fixture/fixture.tar.zst', 'rb').read()
          position = data.find(b'\x1a')
          if position < 0 or position > 65536:
              raise SystemExit('the fixture holds no Ctrl-Z byte in the first 64 KiB')
          print('the fixture holds a Ctrl-Z byte at offset', position)
          PY

      # Everything that the next job needs is staged in one directory, so
      # that the artifact does not carry the tree of the repository with it.
      - name: Stage the artifact
        run: |
          mkdir -p build/stage/fixture
          cp windows/installer/zstd/build/zstdcat.exe build/stage/zstdcat.exe
          cp build/fixture/fixture.tar.zst build/stage/fixture/fixture.tar.zst
          cp build/fixture/member.sha256 build/stage/fixture/member.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: zstd-helper
          path: build/stage/

  tests:
    name: host tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Build and run the host tests
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $candidate = "$env:ProgramFiles\LLVM\bin\clang.exe"
            if (Test-Path $candidate) { $clang = $candidate }
          }
          if (-not $clang) { throw 'clang.exe was not found' }

          New-Item -ItemType Directory -Path build -Force | Out-Null
          & $clang -std=c11 -Wall -Wextra -Werror -O1 -DGU_HOST_TEST=1 `
            -o build/test_generic_board.exe `
            windows/tests/test_generic_board.c windows/efi/board.c windows/efi/checks.c
          if ($LASTEXITCODE -ne 0) { throw 'The test build failed' }
          & build/test_generic_board.exe
          if ($LASTEXITCODE -ne 0) { throw 'The host tests failed' }

      - name: Parse the PowerShell installer scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows/installer/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) at line $($_.Extent.StartLineNumber)" }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed) { throw 'A PowerShell script did not parse' }

      - name: Run the installer logic tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File windows/tests/test-installer-logic.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The installer logic tests failed' }

  installer:
    name: installer package
    runs-on: windows-2022
    needs: [efi, helper]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: efi-application
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: zstd-helper
          path: build/helper

      # The helper is exercised on Windows itself, so that a broken binary
      # cannot reach a release.
      - name: Test the helper
        shell: pwsh
        run: |
          # The same code that the installer uses, so that the test covers the
          # real call path.
          . windows/installer/Get-FirmwareAssets.ps1

          $expected = ((Get-Content build/helper/fixture/member.sha256) -split '\s+')[0].Trim()
          if (-not $expected) { throw 'The fixture digest is missing' }

          & build/helper/zstdcat.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The helper did not start' }

          $helper = (Resolve-Path 'build/helper/zstdcat.exe').Path
          $stream = (Resolve-Path 'build/helper/fixture/fixture.tar.zst').Path

          # The compressed stream goes into the standard input of the helper.
          $inputStream = [System.IO.File]::OpenRead($stream)
          try {
            $result = Invoke-ZstdHelper -HelperPath $helper -Member 'test/member.bin' `
              -OutputPath 'build/helper/member.bin' -InputStream $inputStream
          } finally {
            $inputStream.Dispose()
          }

          $actual = (Get-FileHash build/helper/member.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "The extracted member does not match: expected $expected, got $actual"
          }
          Write-Host "OK   the helper extracted the member ($actual)"

          # The stream is cut in half. The member sits at the front of the
          # archive, so the helper has to be able to finish without reading
          # the rest of it. This is what lets the installer abandon the
          # download once the member is complete.
          $bytes = [System.IO.File]::ReadAllBytes($stream)
          $half = [int]($bytes.Length / 2)
          $cut = New-Object byte[] $half
          [Array]::Copy($bytes, $cut, $half)
          [System.IO.File]::WriteAllBytes('build/helper/cut.tar.zst', $cut)

          $inputStream = [System.IO.File]::OpenRead((Resolve-Path 'build/helper/cut.tar.zst').Path)
          try {
            $result = Invoke-ZstdHelper -HelperPath $helper -Member 'test/member.bin' `
              -OutputPath 'build/helper/member-cut.bin' -InputStream $inputStream
          } finally {
            $inputStream.Dispose()
          }

          $actual = (Get-FileHash build/helper/member-cut.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "The member from the cut stream does not match: expected $expected, got $actual"
          }
          Write-Host "OK   the helper stopped at the member ($actual)"

      - name: Package the installer
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          # makensis ships with the NSIS package on the runner image.
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) { $makensis = $candidate }
          }
          if (-not $makensis) { throw 'makensis.exe was not found' }

          # A tag of the form v1.2.3 names the package; a run that asks for a
          # version names it as well; anything else is a development build.
          # The product version in the resources has to be a plain number, so
          # it is built apart from the name.
          $version = '1.0.0-dev'
          $productVersion = '1.0.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $productVersion = "$version.0"
          }
          if ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION
            $productVersion = "$version.0"
          }
          Write-Host "Building the installer for version $version"

          Push-Location windows/installer
          try {
            & $makensis "-DVERSION=$version" "-DPRODUCT_VERSION=$productVersion" `
              "-DPAYLOAD=..\..\build" "-DHELPER=..\..\build\helper" WindowsGPUUnlock.nsi
            if ($LASTEXITCODE -ne 0) { throw 'The installer packaging failed' }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/installer/*.exe
